server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    static_configs:
      - targets: [localhost]
        labels:
          job: containerlogs
          server: forge-server-01
          __path__: /var/log/containers/*.log

  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          server: forge-server-01
          __path__: /var/log/*.log
