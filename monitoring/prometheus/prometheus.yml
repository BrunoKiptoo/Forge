global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
        labels:
          server: forge-server-01

  - job_name: forge-api
    static_configs:
      - targets: [178.63.72.92:3001]
        labels:
          app: forge-api
