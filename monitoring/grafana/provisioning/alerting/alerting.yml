apiVersion: 1

contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy-receiver
        type: webhook
        settings:
          url: https://ntfy.sh/forge-alerts-bruno
          httpMethod: POST
          title: "{{ .CommonLabels.alertname }}"
          message: "{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}"
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: ntfy
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
