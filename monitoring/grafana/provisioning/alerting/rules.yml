apiVersion: 1

groups:
  - orgId: 1
    name: forge-alerts
    folder: Forge
    interval: 1m
    rules:
      - uid: cpu-high
        title: High CPU Usage
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100)
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "CPU usage is above 80% on forge-server-01"
        labels:
          alertname: HighCPU
          severity: warning

      - uid: memory-high
        title: High Memory Usage
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "Memory usage is above 85% on forge-server-01"
        labels:
          alertname: HighMemory
          severity: warning

      - uid: heartbeat
        title: "✅ Forge Monitoring Alive"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: vector(1)
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 0s
        annotations:
          summary: "✅ Forge server is UP — Prometheus, Grafana, Loki all running. CPU · Memory · Disk being monitored."
        labels:
          alertname: Heartbeat
          severity: info

      - uid: disk-high
        title: High Disk Usage
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Disk usage is above 90% on forge-server-01"
        labels:
          alertname: HighDisk
          severity: critical
